<!DOCTYPE html>
<html>
<head>
<title>Signup Page</title>
</head>

<body style="background-color:silver;background-image:url('6.jpg');background-repeat:no-repeat;background-position:center;background-size:cover;font-family:'Times New Roman',Times,serif;padding:20px;">

<h2 align="center" style="color:darkblue;">Fill the Details</h2>

<hr>

<form>

<table align="center" border="2" cellpadding="8"
style="background-color:white;border:3px solid black;width:400px;padding:10px;">

<tr>
<td style="padding:8px;">Name:</td>
<td><input type="text" required style="width:180px;border:2px solid blue;"></td>
</tr>

<tr>
<td style="padding:8px;">Username:</td>
<td><input type="text" required style="width:180px;border:2px solid blue;"></td>
</tr>

<tr>
<td style="padding:8px;">Password:</td>
<td><input type="password" required style="width:180px;border:2px solid blue;"></td>
</tr>

<tr>
<td style="padding:8px;">Mobile Number:</td>
<td><input type="text" required style="width:180px;border:2px solid blue;"></td>
</tr>

<tr>
<td style="padding:8px;">Age:</td>
<td><input type="number" min="18" max="75" required style="width:180px;border:2px solid blue;"></td>
</tr>

<tr>
<td style="padding:8px;">Date of Birth:</td>
<td><input type="date" required style="width:180px;border:2px solid blue;"></td>
</tr>

<tr>
<td style="padding:8px;">Gender:</td>
<td>
<input type="radio" name="gender"> Male<br>
<input type="radio" name="gender"> Female
</td>
</tr>

<tr>
<td colspan="2" align="center" style="padding:10px;">
<button type="button"
onclick="alert('Success')"
style="background-color:green;color:white;border:2px solid black;padding:6px 15px;">
Submit
</button>
</td>
</tr>

</table>

</form>

<h4 align="center">
<a href="index.html" style="color:blue;text-decoration:none;">BACK TO HOME</a>
</h4>

</body>
</html>
