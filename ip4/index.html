<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Job Portal</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #e9ecef;
      display: flex;
      justify-content: center;
      padding: 30px 20px;
    }

    .form-container {
      background: #ffffff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 350px;
      border-top: 5px solid #d9534f;
    }

    #main-heading {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 20px;
      font-size: 28px;
    }

    .field-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #333;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
      font-size: 14px;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #d9534f;
      outline: none;
    }

    .error-text {
      color: #d9534f;
      font-size: 12px;
      margin-top: 4px;
    }

    .btn-submit {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      background-color: #d9534f;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-submit:hover {
      background-color: #c9302c;
    }

    #confirmationAlert {
      color: green;
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="form-container">

    <h2 id="main-heading"></h2>

    <form id="candidateForm" novalidate>

      <div class="field-group">
        <label for="applicantName">Full Name *</label>
        <input type="text" id="applicantName" placeholder="John Doe">
        <div class="error-text" id="err-applicantName"></div>
      </div>

      <div class="field-group">
        <label for="applicantEmail">Email Address *</label>
        <input type="text" id="applicantEmail" placeholder="example@domain.com">
        <div class="error-text" id="err-applicantEmail"></div>
      </div>

      <div class="field-group">
        <label for="applicantPhone">Phone Number *</label>
        <input type="text" id="applicantPhone" placeholder="10 digit number">
        <div class="error-text" id="err-applicantPhone"></div>
      </div>

      <div class="field-group">
        <label for="applicantPassword">Password *</label>
        <input type="password" id="applicantPassword" placeholder="At least 6 characters">
        <div class="error-text" id="err-applicantPassword"></div>
      </div>

      <div class="field-group">
        <label for="targetRole">Desired Job Title *</label>
        <input type="text" id="targetRole" placeholder="e.g. Frontend Developer">
        <div class="error-text" id="err-targetRole"></div>
      </div>

      <div class="field-group">
        <label for="yearsExp">Years of Experience *</label>
        <input type="number" id="yearsExp" placeholder="e.g. 3">
        <div class="error-text" id="err-yearsExp"></div>
      </div>

      <div class="field-group">
        <label for="portfolioUrl">Resume Link (Drive / Dropbox) *</label>
        <input type="text" id="portfolioUrl" placeholder="https://...">
        <div class="error-text" id="err-portfolioUrl"></div>
      </div>

      <div class="field-group">
        <label for="documentFile">Upload Resume (PDF or DOC only) *</label>
        <input type="file" id="documentFile" accept=".pdf,.doc,.docx">
        <div class="error-text" id="err-documentFile"></div>
      </div>

      <button type="submit" class="btn-submit">Register</button>

      <div id="confirmationAlert"></div>

    </form>

  </div>

  <script>

    let pageTitle = "job portal";

    document.getElementById("main-heading").innerHTML =
      pageTitle.toUpperCase();

    document.getElementById("candidateForm").addEventListener(
      "submit",
      function(event) {

        event.preventDefault();

        let isValid = true;

        document.getElementById("err-applicantName").innerText = "";
        document.getElementById("err-applicantEmail").innerText = "";
        document.getElementById("err-applicantPhone").innerText = "";
        document.getElementById("err-applicantPassword").innerText = "";
        document.getElementById("err-targetRole").innerText = "";
        document.getElementById("err-yearsExp").innerText = "";
        document.getElementById("err-portfolioUrl").innerText = "";
        document.getElementById("err-documentFile").innerText = "";
        document.getElementById("confirmationAlert").innerText = "";

        let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        let phonePattern = /^\d{10}$/;
        let urlPattern = /^https?:\/\/.+/;

        let name = document.getElementById("applicantName").value.trim();
        let email = document.getElementById("applicantEmail").value.trim();
        let phone = document.getElementById("applicantPhone").value.trim();
        let password = document.getElementById("applicantPassword").value.trim();
        let role = document.getElementById("targetRole").value.trim();
        let exp = document.getElementById("yearsExp").value.trim();
        let url = document.getElementById("portfolioUrl").value.trim();
        let fileInput = document.getElementById("documentFile");

        if (name === "") {
          document.getElementById("err-applicantName").innerText =
            "Full Name is required.";
          isValid = false;
        }

        if (email === "") {
          document.getElementById("err-applicantEmail").innerText =
            "Email address is required.";
          isValid = false;
        } else if (!emailPattern.test(email)) {
          document.getElementById("err-applicantEmail").innerText =
            "Please enter a valid email address.";
          isValid = false;
        }

        if (phone === "") {
          document.getElementById("err-applicantPhone").innerText =
            "Phone number is required.";
          isValid = false;
        } else if (!phonePattern.test(phone)) {
          document.getElementById("err-applicantPhone").innerText =
            "Phone number must be exactly 10 digits.";
          isValid = false;
        }

        if (password === "") {
          document.getElementById("err-applicantPassword").innerText =
            "Password is required.";
          isValid = false;
        } else if (password.length < 6) {
          document.getElementById("err-applicantPassword").innerText =
            "Password must be at least 6 characters.";
          isValid = false;
        }

        if (role === "") {
          document.getElementById("err-targetRole").innerText =
            "Desired Job Title is required.";
          isValid = false;
        }

        if (exp === "") {
          document.getElementById("err-yearsExp").innerText =
            "Years of experience is required.";
          isValid = false;
        }

        if (url === "") {
          document.getElementById("err-portfolioUrl").innerText =
            "Resume link is required.";
          isValid = false;
        } else if (!urlPattern.test(url)) {
          document.getElementById("err-portfolioUrl").innerText =
            "Enter a valid URL starting with http:// or https://.";
          isValid = false;
        }

        if (fileInput.files.length === 0) {
          document.getElementById("err-documentFile").innerText =
            "Please upload your resume file.";
          isValid = false;
        } else {
          let fileName = fileInput.files[0].name.toLowerCase();

          let allowedExtensions = [".pdf", ".doc", ".docx"];

          let validFile = allowedExtensions.some(function(extension) {
            return fileName.endsWith(extension);
          });

          if (!validFile) {
            document.getElementById("err-documentFile").innerText =
              "Only PDF, DOC, or DOCX files are allowed.";
            isValid = false;
          }
        }

        if (isValid === true) {
          document.getElementById("confirmationAlert").innerText =
            "Registration Successful!";
        }

      }
    );

  </script>

</body>
</html>
