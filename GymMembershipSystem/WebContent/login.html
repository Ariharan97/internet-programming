<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Login | FITNESS HUB</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <a href="index.html" class="logo">
            ⚡ FITNESS <span>HUB</span>
        </a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="register.html">Register</a></li>
            <li><a href="login.html" class="active nav-btn">Login</a></li>
        </ul>
    </nav>

    <!-- Login Form Wrapper -->
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h2>MEMBER <span>LOGIN</span></h2>
                <p>Enter your credentials to access your fitness dashboard</p>
            </div>

            <!-- Dynamic Alert Banner for Errors or Registration Success -->
            <div id="alertBanner" class="alert-banner" style="display: none;"></div>

            <form id="loginForm" action="LoginServlet" method="POST" novalidate>
                <!-- Email Address -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="alex@example.com" required>
                    <div id="emailError" class="error-message"></div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                    <div id="passwordError" class="error-message"></div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; margin-top: 1rem;">
                    Sign In ➔
                </button>
            </form>

            <div class="auth-footer">
                Don't have a membership yet? <a href="register.html">Register now</a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p><strong>FITNESS HUB</strong> &copy; 2026. All Rights Reserved.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
